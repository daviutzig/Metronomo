name: Gerador Automático de APK

on:
  push:
    branches: [ "main", "master" ] # Dispara toda vez que você atualiza o código
  workflow_dispatch: # Permite que você clique em um botão para gerar quando quiser

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Baixando o codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurando o Java (Necessario para Android)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurando o Flutter SDK
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'
        cache: true

    - name: Criando a estrutura de pastas do Android
      run: flutter create . --platforms=android

    - name: Garantindo pasta de assets
      run: mkdir -p assets

    - name: Instalando dependencias atualizadas
      run: flutter pub get
      
    - name: Gerar arquivo de audio compativel
      run: python3 gerar_click.py

    - name: Compilando o arquivo APK final
      run: flutter build apk --debug -t main.dart

    - name: Disponibilizando o APK para Download
      uses: actions/upload-artifact@v4
      with:
        name: Metronome-App-Instalavel
        path: build/app/outputs/flutter-apk/app-debug.apk
